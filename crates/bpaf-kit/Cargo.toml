[package]
name = "bpaf-kit"
description = "Batteries for Rust CLIs built on bpaf: #[derive(Cli)] startup, subprocesses, Ctrl-C, --version build info, did-you-mean, tables, manpages, logging"
version.workspace = true
edition.workspace = true
# Let chains need 1.88.
rust-version = "1.88"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
documentation = "https://docs.rs/bpaf-kit"
keywords = ["bpaf", "cli", "command-line", "argument-parsing", "subprocess"]
categories = ["command-line-interface", "development-tools"]

[features]
default = ["derive"]
## `#[derive(Cli)]`.
derive = ["dep:bpaf-kit-macros"]
## `miette::Diagnostic` impls on the error types.
miette = ["dep:miette"]
## `table`: comfy-table presets.
table = ["dep:comfy-table"]
## `man`: manpage rendering from the bpaf parser.
man = ["bpaf/docgen"]
## `log`: tracing-subscriber init with `-v`/`-q` counting flags.
log = ["dep:tracing", "dep:tracing-subscriber"]
## `--log-json`: JSON log lines (pulls serde_json).
log-json = ["log", "tracing-subscriber/json"]
## `suggest::parse_enum` for strum `EnumString + VariantNames` enums.
strum = ["dep:strum"]
## `prompt`: dialoguer helpers.
prompt = ["dep:dialoguer"]

[dependencies]
bpaf.workspace = true
bpaf-kit-macros = { workspace = true, optional = true }
comfy-table = { workspace = true, optional = true }
ctrlc.workspace = true
dialoguer = { workspace = true, optional = true }
miette = { workspace = true, optional = true }
strsim.workspace = true
strum = { workspace = true, optional = true }
thiserror.workspace = true
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

[dev-dependencies]
# Path only, so `cargo publish` strips it: release-plz orders publishes by
# normal and build dependencies, so a versioned dev-dependency on an
# unpublished bpaf-kit-build fails the bpaf-kit publish.
bpaf-kit-build = { path = "../bpaf-kit-build" }
bpaf = { workspace = true, features = ["derive"] }
strum = { workspace = true, features = ["derive"] }

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
