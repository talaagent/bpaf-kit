[package]
name = "demo"
description = "Example CLI exercising every bpaf-kit module."
version.workspace = true
edition.workspace = true
# Let chains need 1.88.
rust-version = "1.88"
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
bpaf = { workspace = true, features = ["derive"] }
bpaf-kit = { workspace = true, features = ["log-json", "man", "prompt", "strum", "table"] }
strum = { workspace = true, features = ["derive"] }
thiserror.workspace = true
tracing.workspace = true

[build-dependencies]
bpaf-kit-build.workspace = true

[lints]
workspace = true
