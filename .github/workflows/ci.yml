name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Off while the repo is private (no Actions minutes); on once public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: fmt
        run: nix develop -c cargo fmt --check
      - name: clippy
        run: nix develop -c cargo clippy --all-targets -- -D warnings
      - name: test
        run: nix develop -c cargo test
      - name: feature combinations
        run: |
          nix develop -c cargo clippy -p bpaf-kit --no-default-features --all-targets -- -D warnings
          nix develop -c cargo test -p bpaf-kit --no-default-features
          nix develop -c cargo test -p bpaf-kit --all-features
      - name: nix build
        run: nix build .#demo && ./result/bin/demo --version --verbose

  msrv:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Overrides rust-toolchain.toml; keep in step with `rust-version`.
      RUSTUP_TOOLCHAIN: "1.88"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - name: check
        run: cargo check --workspace --all-features --locked
      - name: test
        run: cargo test -p bpaf-kit --locked
