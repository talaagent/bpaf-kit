name: Bug report
description: Report a reproducible problem.
body:
  - type: markdown
    attributes:
      value: "Remove secrets from command lines, environment variables and logs. Report vulnerabilities privately using SECURITY.md."
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: The smallest CLI definition, `Cmd` call or `build.rs`, and the command line you ran, that shows the problem.
      render: rust
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Include the full output or error (with its code) and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Version and environment
      description: Crate names and versions, enabled features, bpaf version, Rust version, and OS.
    validations:
      required: true
