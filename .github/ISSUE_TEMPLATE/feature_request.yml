name: Feature request
description: Suggest an API, workflow, or documentation improvement.
body:
  - type: textarea
    id: problem
    attributes:
      label: Use case
      description: What are you trying to do in your CLI, and where does the current behavior fall short?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include an example of the Rust API or command-line behavior you want, and any alternatives you considered.
    validations:
      required: true
