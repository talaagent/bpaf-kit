[workspace]
resolver = "3"
members = ["crates/*", "examples/*"]

[workspace.package]
version = "0.2.1"
edition = "2024"
# The default MSRV, edition 2024's floor: bpaf-kit-macros and
# bpaf-kit-build. bpaf-kit (and the demo) override it with 1.88 (let
# chains). CI's `msrv` job tests each crate at its own value.
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/talaagent/bpaf-kit"
homepage = "https://github.com/talaagent/bpaf-kit"
authors = ["Ian Macalinao <github@igm.pub>"]

[workspace.dependencies]
bpaf = "0.9.20"
comfy-table = "8"
ctrlc = "3.4"
dialoguer = { version = "0.12", default-features = false }
miette = { version = "7.6", default-features = false, features = ["derive"] }
proc-macro2 = "1"
quote = "1"
strsim = "0.11"
strum = { version = "0.28", default-features = false }
syn = { version = "3", default-features = false, features = ["derive", "parsing", "printing", "proc-macro"] }
thiserror = "2"
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "env-filter", "ansi"] }
bpaf-kit = { version = "0.2.1", path = "crates/bpaf-kit" }
bpaf-kit-build = { version = "0.2.1", path = "crates/bpaf-kit-build" }
bpaf-kit-macros = { version = "0.2.1", path = "crates/bpaf-kit-macros" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
complexity = { level = "deny", priority = -1 }
must_use_candidate = "allow"
module_name_repetitions = "allow"
needless_pass_by_value = "allow"
# Error codes are documented on the error enums.
missing_errors_doc = "allow"
unwrap_used = "deny"
clone_on_ref_ptr = "deny"
std_instead_of_alloc = "deny"
std_instead_of_core = "deny"
cognitive_complexity = "deny"
too_many_lines = "deny"
