# Runs from .github/workflows/release-plz.yml while the repository is public.
# All crates share one version, one changelog (CHANGELOG.md) and one
# `v<version>` tag and GitHub release, owned by bpaf-kit.
[workspace]
changelog_update = false
git_tag_enable = false
git_release_enable = false
publish = true
semver_check = true
pr_draft = false
# Publish only when the pushed commit is a merged release-plz PR, not on any
# version bump.
release_always = false

[[package]]
name = "bpaf-kit"
changelog_update = true
changelog_path = "CHANGELOG.md"
changelog_include = ["bpaf-kit-macros", "bpaf-kit-build"]
git_tag_enable = true
git_tag_name = "v{{ version }}"
git_release_enable = true
git_release_name = "v{{ version }}"
version_group = "bpaf-kit"

[[package]]
name = "bpaf-kit-macros"
version_group = "bpaf-kit"

[[package]]
name = "bpaf-kit-build"
version_group = "bpaf-kit"

# The example CLI: publish = false in its Cargo.toml, so not released.
[[package]]
name = "demo"
publish = false
release = false
